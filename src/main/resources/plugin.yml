name: skkaemok
description: A Skript addon focused on changing player nametags, skins, and more
author: kkaemok
website: https://github.com/kkaemok/Skkaemok
version: '${version}'
main: org.kkaemok.skkaemok.Skkaemok
api-version: '1.21.5'
depend: [Skript]
softdepend: [packetevents, LuckPerms, TAB]
commands:
  skkaemok:
    description: Skkaemok management commands
    usage: /<command> <reload>
permissions:
  skkaemok.op:
    description: Allows Skkaemok management commands.
    default: op
  skkaemok.inspect:
    description: Inspect effective appearances and nickname aliases
    default: op
