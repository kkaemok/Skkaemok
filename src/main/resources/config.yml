# Skkaemok config 1.8
skin:
  mojang:
    api-base: "https://api.mojang.com"
    session-base: "https://sessionserver.mojang.com"
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  mineskin:
    api-base: "https://api.mineskin.org"
    api-key: ""
    user-agent: ""
    visibility: "unlisted"
    variant: "auto"
    use-queue: true
    poll-interval-ms: 1000
    max-poll-seconds: 30
    request-timeout-ms: 15000
    require-api-key: false
  url:
    allow-unsigned: false

tab:
  # true -> TAB plugin is present: use TAB customtabname API. TAB missing: apply directly.
  # false -> never use TAB API; Skkaemok applies tab names directly.
  # Per-viewer tablist overrides always use PLAYER_INFO packets because TAB's
  # customtabname API stores one global value per target player.
  integration: true
  # Value passed to TAB API when TAB integration is active.
  # %prefix%/%suffix% use vanilla team decorations. LuckPerms is kept to nametags.
  # Available tokens: %prefix% %nickname% %suffix% %original%
  custom-name-format: "%nickname%"
  reapply:
    # Reapply once after join/change to win against plugins that update tab names late.
    enabled: true
    delay-ticks: 10

integration:
  luckperms:
    enabled: true

vanilla-team-sync:
  # Outgoing scoreboard-team packets trigger an immediate, debounced comparison.
  # This active-player-only fallback also catches updates hidden by scoreboard plugins.
  # Set to 0 to disable the fallback. Values below 10 are clamped to 10 ticks.
  fallback-interval-ticks: 20

dependencies:
  packetevents:
    # Download the latest stable official Spigot jar only when missing; restart once after installation.
    auto-download: true

nickname-commands:
  debug: false

names:
  # These aliases cannot be used as player names in native commands.
  reject-reserved-aliases: true
  # Duplicate display names remain allowed by default; ambiguous aliases never resolve.
  reject-ambiguous-aliases: false

# Formatting mode: auto | legacy | minimessage
format:
  luckperms: auto
  nickname: auto
  output: auto

output:
  # Nametag composition around the profile-name section.
  # %team_prefix%/%team_suffix% = vanilla scoreboard team components
  # %prefix%/%suffix%           = LuckPerms metadata components
  # %nickname%                  = the client profile name (must be present once)
  # %original%                  = the real Minecraft account name
  nametag: "%team_prefix%%prefix%%nickname%%suffix%%team_suffix%"

  # Tablist tokens retain their existing compatibility behavior:
  # %prefix%/%suffix% are vanilla team decorations. %team_prefix% and
  # %team_suffix% are equivalent explicit aliases. %lp_prefix% and
  # %lp_suffix% add LuckPerms metadata when desired.
  tablist: "%prefix%%nickname%%suffix%"

# Rewrites identified player labels in command feedback and chat metadata.
output-name-rewrite:
  enabled: true
  debug: false
  # Legacy key retained for configuration compatibility; message bodies stay intact.
  # Only sender/recipient labels are rewritten in signed chat packets.
  rewrite-chat-message-content: false
  chat-command-decorate:
    # Experimental fallback for Paper chat-command decoration.
    enabled: false
    debug-marker: false

# Checks the latest GitHub release and notifies operators when they join.
update-checker:
  enabled: true
  check-interval-minutes: 360
  notify-per-login: true
  github-api-url: "https://api.github.com/repos/kkaemok/Skkaemok/releases/latest"
